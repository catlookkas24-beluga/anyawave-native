[workspace]
members = ["crates/aw-engine", "crates/aw-voice", "crates/aw-server"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "0.3"
bytes = "1"
tracing = "0.1"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
socket2 = "0.5"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
